services:
  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello from Compose!}"
      STORAGE: "redis"
      REDIS_URL: "redis://redis:6379/0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
